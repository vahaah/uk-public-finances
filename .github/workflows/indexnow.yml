name: indexnow

on:
  workflow_dispatch:
    inputs:
      all:
        description: Submit every sitemap URL
        type: boolean
        default: false

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: indexnow-marker
          path: artifacts
      - run: npm run indexnow -- ${{ inputs.all && '--all' || '' }}
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          INDEXNOW_HOST: budget.vahaah.com
          INDEXNOW_MARKER: artifacts/indexnow-marker.json
      - uses: actions/upload-artifact@v4
        with:
          name: indexnow-marker
          path: artifacts/indexnow-marker.json
